name: Update videos and deploy

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Re-read the whole channel (backfill / repair)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch videos from YouTube
        run: node scripts/update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE || '@CODLeague' }}
          FULL_SYNC: ${{ inputs.full_sync }}

      - name: Commit data if it changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain site/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update videos"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
