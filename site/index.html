<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDL VOD Archive</title>
  <meta name="description" content="Every Call of Duty League tournament broadcast, grouped by season and event, with live streams.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">CDL <b>VODs</b></span>
      </a>
      <div class="nav-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 100-14 7 7 0 000 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search titles…" aria-label="Search titles">
        </div>
        <a id="live-link" class="yt-btn" href="https://www.youtube.com/@CODLeague" target="_blank" rel="noopener">YouTube ↗</a>
      </div>
    </div>
    <div class="controls" id="controls">
      <div class="seasons" id="seasons" role="tablist" aria-label="Season"></div>
      <div class="kinds" id="kinds" role="group" aria-label="Content type"></div>
    </div>
  </header>

  <main id="top">
    <section id="hero" class="hero" hidden></section>
    <div id="rows"></div>
    <p id="empty" class="empty" hidden>No videos match your filters.</p>
    <p id="loading" class="empty">Loading the archive…</p>
  </main>

  <footer>
    <div class="foot-left">
      <span id="updated"></span>
      <span class="dim">Videos from the official Call of Duty League YouTube channel. Not affiliated with Activision or the CDL.</span>
    </div>
    <a class="credit" href="https://www.linkedin.com/in/djiedjom-aniakou/" target="_blank" rel="noopener" aria-label="Djiedjom Aniakou on LinkedIn">
      <span>Built by <b>Djiedjom Aniakou</b></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 110-4.13 2.06 2.06 0 010 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .78 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .78 23.2 0 22.22 0z"/></svg>
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
