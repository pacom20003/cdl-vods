<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDL VOD Archive</title>
  <meta name="description" content="Every Call of Duty League tournament broadcast, grouped by season and event, with live streams.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">CDL <b>VODs</b></span>
      </a>
      <div class="nav-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 100-14 7 7 0 000 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search titles…" aria-label="Search titles">
        </div>
        <a id="live-link" class="yt-btn" href="https://www.youtube.com/@CODLeague" target="_blank" rel="noopener">YouTube ↗</a>
      </div>
    </div>
    <div class="controls" id="controls">
      <div class="seasons" id="seasons" role="tablist" aria-label="Season"></div>
      <div class="kinds" id="kinds" role="group" aria-label="Content type"></div>
    </div>
  </header>

  <main id="top">
    <section id="hero" class="hero" hidden></section>
    <div id="rows"></div>
    <p id="empty" class="empty" hidden>No videos match your filters.</p>
    <p id="loading" class="empty">Loading the archive…</p>
  </main>

  <footer>
    <span id="updated"></span>
    <span class="dim">Videos from the official Call of Duty League YouTube channel. Not affiliated with Activision or the CDL.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
